name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The suite plays several hundred full games on the mock adapter, so it
    # takes ~12 minutes. This is a runaway guard, not a target.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Test (pytest)
        run: uv run pytest -q
        env:
          # Nothing in CI may call a real provider API; adapters must be mocked.
          SECRET_AGI_ENVIRONMENT: testing
